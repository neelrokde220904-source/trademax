[tool.poetry]
name = "india-ai-trader"
version = "2.0.0"
description = "Autonomous AI Trading System — Global Quantitative Hedge Fund (NSE/BSE/US/EU)"
authors = ["India AI Trader"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
# ── v1.0 core ──────────────────────────────
smartapi-python = "^1.4.1"
pyotp = "^2.9.0"
langgraph = ">=0.2.0"
langchain-anthropic = ">=0.2.0"
langchain-core = ">=0.3.0"
anthropic = ">=0.34.0"
pandas = "^2.2.0"
pandas-ta = "^0.3.14b"
numpy = "^1.26.0"
yfinance = "^0.2.36"
sqlalchemy = "^2.0.0"
aiosqlite = "^0.20.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
apscheduler = "^3.10.4"
python-telegram-bot = "^21.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sse-starlette = "^2.0.0"
httpx = "^0.27.0"
aiohttp = "^3.9.0"
feedparser = "^6.0.11"
beautifulsoup4 = "^4.12.0"
tenacity = "^8.2.0"
loguru = "^0.7.2"
websockets = "^12.0"
pytz = "^2024.1"
scipy = "^1.12.0"
# ── v2.0 additions ─────────────────────────
# HMM Regime Classifier
hmmlearn = ">=0.3.0"
# MARL Portfolio Optimizer
stable-baselines3 = ">=2.3.0"
gymnasium = ">=0.29.0"
torch = ">=2.0.0"
# Global Brokers
ib_insync = ">=0.9.86"
alpaca-py = ">=0.21.0"
# Event-Driven Stream
confluent-kafka = {version = ">=2.3.0", optional = true}
# Vector DB / Episodic Memory
chromadb = ">=0.4.0"
langchain = ">=0.2.0"
# Options Delta Hedger
mibian = ">=0.1.3"
# Graph / Visualization
networkx = ">=3.2"
pyvis = ">=0.3.2"
# Structured Logging
structlog = ">=24.1.0"
# ── v2.1 additions ─────────────────────────
# Hyperparameter Optimization
optuna = ">=3.5.0"
# ML Signal Gate
xgboost = ">=2.0.0"
scikit-learn = ">=1.4.0"
# Cointegration / Pairs Trading
statsmodels = ">=0.14.0"

[tool.poetry.extras]
kafka = ["confluent-kafka"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
